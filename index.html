<!DOCTYPE html><html lang="en"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>Premium Image Uploader</title> <style> @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */ }
body { /* Premium soft gradient background */ background: linear-gradient(135deg, #e2e2e2 0%, #f5f7fa 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
.app-card { width: 100%; max-width: 380px; background: #ffffff; border-radius: 24px; padding: 30px 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08); text-align: center; position: relative; overflow: hidden; }
.header h2 { font-size: 22px; color: #1e293b; font-weight: 600; margin-bottom: 5px; }
.header p { font-size: 13px; color: #64748b; margin-bottom: 25px; }
/* Modern Drag & Drop / Upload Box */ .upload-area { border: 2px dashed #cbd5e1; border-radius: 18px; padding: 40px 20px; background-color: #f8fafc; cursor: pointer; transition: all 0.3s ease; margin-bottom: 20px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.upload-area:hover, .upload-area.active { border-color: #6366f1; background-color: #eef2ff; }
.upload-area svg { width: 45px; height: 45px; fill: #818cf8; margin-bottom: 12px; transition: transform 0.3s ease; }
.upload-area:hover svg { transform: translateY(-5px); }
.upload-area span { font-size: 14px; color: #475569; font-weight: 500; pointer-events: none; }
.upload-area #fileName { font-size: 12px; color: #6366f1; margin-top: 5px; font-weight: 600; display: none; }
#imageInput { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; top: 0; left: 0; z-index: 10; }
/* Premium Gradient Button */ .primary-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: white; border: none; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35); transition: transform 0.2s, box-shadow 0.2s; outline: none; }
.primary-btn:active { transform: translateY(2px); box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3); }
.primary-btn:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; transform: none; }
/* Result Section */ .result-box { display: none; margin-top: 25px; animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
.preview-img { width: 100%; height: 190px; object-fit: cover; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
.link-container { display: flex; background: #f1f5f9; border-radius: 14px; padding: 6px; align-items: center; border: 1px solid #e2e8f0; }
.link-container input { flex: 1; background: transparent; border: none; padding: 12px 15px; font-size: 13px; color: #334155; outline: none; width: 100%; }
.copy-btn { background: #ffffff; color: #6366f1; border: none; padding: 12px 18px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: all 0.3s; }
.copy-btn:active { background: #f8fafc; transform: scale(0.95); } </style></head><body>
<div class="app-card"> <div class="header"> <h2>Upload Media</h2> <p>Get a direct link instantly</p> </div>
<div class="upload-area" id="uploadArea"> <input type="file" id="imageInput" accept="image/*"> <!-- Custom Cloud SVG Icon --> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"> <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/> </svg> <span id="uploadText">Tap to select an image</span> <span id="fileName"></span> </div>
<button class="primary-btn" id="uploadBtn">Upload Image</button>
<div class="result-box" id="resultContainer"> <img id="imagePreview" class="preview-img" alt="Uploaded Preview"> <div class="link-container"> <input type="text" id="directLink" readonly> <button class="copy-btn" id="copyBtn">Copy</button> </div> </div> </div>
<script> const API_KEY = '190f2069ac3b08bcdc6818d9023274ec'; // আপনার ImgBB API const imageInput = document.getElementById('imageInput'); const uploadArea = document.getElementById('uploadArea'); const uploadText = document.getElementById('uploadText'); const fileNameDisplay = document.getElementById('fileName'); const uploadBtn = document.getElementById('uploadBtn'); const resultContainer = document.getElementById('resultContainer'); const directLinkInput = document.getElementById('directLink'); const copyBtn = document.getElementById('copyBtn'); const imagePreview = document.getElementById('imagePreview');
// ফাইল সিলেক্ট করলে UI তে ফাইলের নাম দেখানো হবে imageInput.addEventListener('change', (e) => { const file = e.target.files[0]; if (file) { uploadArea.classList.add('active'); uploadText.innerText = 'Image Selected'; fileNameDisplay.innerText = file.name.length > 25 ? file.name.substring(0, 25) + '...' : file.name; fileNameDisplay.style.display = 'block'; } else { uploadArea.classList.remove('active'); uploadText.innerText = 'Tap to select an image'; fileNameDisplay.style.display = 'none'; } });
uploadBtn.addEventListener('click', async () => { const file = imageInput.files[0]; if (!file) { alert('Please select an image first!'); return; }
// বাটনের এনিমেশন ও টেক্সট পরিবর্তন uploadBtn.innerText = 'Uploading... ⏳'; uploadBtn.disabled = true; resultContainer.style.display = 'none';
const formData = new FormData(); formData.append('image', file); formData.append('key', API_KEY);
try { const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
const data = await response.json();
if (data.success) { directLinkInput.value = data.data.url; imagePreview.src = data.data.url; // রেজাল্ট বক্স শো করানো resultContainer.style.display = 'block'; uploadBtn.innerText = 'Upload Successful! 🎉'; // কিছুক্ষণ পর আবার বাটন রিসেট setTimeout(() => { uploadBtn.innerText = 'Upload New Image'; uploadBtn.disabled = false; // ইনপুট রিসেট imageInput.value = ''; uploadArea.classList.remove('active'); uploadText.innerText = 'Tap to select an image'; fileNameDisplay.style.display = 'none'; }, 3000);
} else { alert('Upload failed: ' + data.error.message); uploadBtn.innerText = 'Upload Image'; uploadBtn.disabled = false; } } catch (error) { alert('Connection error! Check your internet.'); uploadBtn.innerText = 'Upload Image'; uploadBtn.disabled = false; } });
// স্মার্ট কপি বাটন copyBtn.addEventListener('click', () => { directLinkInput.select(); directLinkInput.setSelectionRange(0, 99999); navigator.clipboard.writeText(directLinkInput.value).then(() => { copyBtn.innerText = 'Copied! ✔'; copyBtn.style.color = '#10b981'; // Success Green Color setTimeout(() => { copyBtn.innerText = 'Copy'; copyBtn.style.color = '#6366f1'; // Original Purple Color }, 2000); }).catch(err => { // Fallback for older browsers document.execCommand('copy'); copyBtn.innerText = 'Copied!'; }); }); </script></body></html>
